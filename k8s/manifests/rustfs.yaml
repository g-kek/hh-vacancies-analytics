apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: hw5
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: hw5
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      priorityClassName: hw5-high
      initContainers:
        - name: prepare-disks
          image: docker.io/rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for disk in /data/disk1 /data/disk2 /data/disk3 /data/disk4; do
                mkdir -p "$disk"
                chown 10001:10001 "$disk"
              done
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: storage
              mountPath: /data
      containers:
        - name: rustfs
          image: docker.io/rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          args: ["rustfs", "server", "/data/disk{1...4}"]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-internal
                  key: S3_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-internal
                  key: S3_SECRET_KEY
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_STORAGE_CLASS_STANDARD
              value: "EC:2"
            - name: RUSTFS_ERASURE_SET_DRIVE_COUNT
              value: "4"
            - name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK
              value: "true"
            - name: RUSTFS_OBJECT_DATA_CACHE_ENABLE
              value: "false"
            - name: RUSTFS_LOCAL_FD_CACHE_ENABLE
              value: "false"
            - name: RUSTFS_IO_URING_FD_CACHE_ENABLE
              value: "false"
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: warn
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: hw5
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
