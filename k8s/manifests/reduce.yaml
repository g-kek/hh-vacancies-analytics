apiVersion: batch/v1
kind: Job
metadata:
  name: hh-reduce
  namespace: hw5
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: analytics
          image: hh-analytics:hw5
          imagePullPolicy: Never
          args: ["reduce"]
          envFrom:
            - secretRef:
                name: s3-internal
          resources:
            requests:
              cpu: "250m"
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
